plugins {
 id 'com.android.application'
}

android {
 namespace 'local.ryusledger.android'
 compileSdk 35

 defaultConfig {
  applicationId 'local.ryusledger.android'
  minSdk 26
  targetSdk 35

  versionCode 2
  versionName '5.2.0'
 }

 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }

 packaging {
  resources {
   excludes += [
           'META-INF/versions/**',
           'META-INF/*.SF',
           'META-INF/*.RSA',
           'META-INF/*.DSA'
   ]
  }
 }
}

dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'androidx.biometric:biometric:1.1.0'
 implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}

tasks.register('checkLedgerAssets') {
 doLast {
  def html = file('src/main/assets/ui/index.html')
  def js = file('src/main/assets/ui/app.js')
  def bridge = file('src/main/assets/ui/android-bridge.js')

  if (!html.exists() || !js.exists()) {
   throw new GradleException(
           'Run PREPARE_ANDROID.cmd first to import the existing desktop UI folder.'
   )
  }

  if (!bridge.exists()) {
   throw new GradleException(
           'Android bridge is missing from src/main/assets/ui.'
   )
  }

  if (!html.getText('UTF-8').contains('android-bridge.js')) {
   throw new GradleException(
           'Android bridge is not included in index.html.'
   )
  }

  if (!html.getText('UTF-8').contains('class="compact"')) {
   throw new GradleException(
           'Mobile-default layout was not applied.'
   )
  }
 }
}

tasks.named('preBuild').configure {
 dependsOn 'checkLedgerAssets'
}

tasks.withType(JavaCompile).configureEach {
 options.encoding = 'UTF-8'
}